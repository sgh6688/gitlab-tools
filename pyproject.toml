[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-tools"
version = "0.3.1"
description = "Extensible GitLab automation and export tools"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gitlab-tools = "gitlab_tools.cli:main"

[tool.setuptools.packages.find]
include = ["gitlab_tools*"]

[tool.setuptools.package-data]
"gitlab_tools.templates" = ["*.txt", "*.bat"]
